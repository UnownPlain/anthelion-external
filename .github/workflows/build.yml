name: Build Anthelion

on:
  schedule:
    - cron: '33 8 * * *'
  workflow_dispatch:

concurrency:
  group: build-anthelion
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  UPSTREAM_REPOSITORY: UnownPlain/anthelion

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-slim
    timeout-minutes: 10

    permissions:
      contents: write # Required to push to repo

    steps:
      - name: Checkout output repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required to push to repo

      - name: Checkout Anthelion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
          persist-credentials: false

      - name: Set up Bun
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.6.14
          install_args: bun
          working_directory: ${{ github.workspace }}/upstream

      - name: Install dependencies and build
        working-directory: upstream
        run: |
          bun ci
          bun build:ext

      - name: Update build output
        run: |
          rm -rf dist package.json
          cp -R upstream/dist .
          cp upstream/package.json .
          bun pm pkg delete devDependencies scripts packageManager

      - name: Commit and push
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          rm -rf upstream

          if git diff --quiet --exit-code && [ -z "$(git status --short)" ]; then
            echo "Build output is already current."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Build ${UPSTREAM_REPOSITORY}@${upstream_sha}"
          git push
